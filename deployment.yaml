apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
      version: blue
  template:
    metadata:
      labels:
        app: myapp
        version: blue
    spec:
      containers:
      - name: app
        image: 883644721688.dkr.ecr.ap-south-1.amazonaws.com/devops-app:v1
        ports:
        - containerPort: 3000
